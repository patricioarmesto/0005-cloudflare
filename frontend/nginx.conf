# nginx.conf — Sirve el build de Vite y hace de proxy inverso hacia el edge.
# ¿Por qué el proxy? En la vida real el usuario habla con el POP, no con el origen.
# Acá el browser habla con nginx en :5177 y nginx le pasa /pagina y /api al Go en backend:8080.
# Eso además evita CORS: todo queda en el mismo origen desde el punto de vista del browser.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ojo: proxy_pass SIN barra final para que el path llegue intacto al ServeMux de Go.
    # Si hacés esto distinto (proxy_pass http://backend:8080/), /pagina/precios se
    # reescribe como /precios y el edge responde 404.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /pagina {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta desconocida del frontend devuelve index.html y React resuelve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
